formal:
  defaults:
    storage: persistent
    seed: 825
    output:
      method: fixed
      length: 128
  profiles:
    functional_smoke:
      description: 1024 token 输入、128 token 输出的功能冒烟数据
      request_count: 8
      input:
        method: fixed
        length: 1024
    fixed_long:
      description: 固定 64K 输入、2560 token 输出的长序列性能数据
      request_count: 24
      input:
        method: fixed
        length: 65536
      output:
        method: fixed
        length: 2560
    variable_long:
      description: 40K 至 80K 输入、均值 64K 的变长性能数据
      request_count: 24
      seed: 826
      input:
        method: gaussian
        mean: 65536
        stddev: 10240
        min: 40960
        max: 81920
      output:
        method: fixed
        length: 2560
    srf_mixed:
      description: 1K 与 64K 输入各占一半的 SRF 混合数据
      request_count: 32
      seed: 827
      input:
        method: percentage
        values:
          - [1024, 0.5]
          - [65536, 0.5]
      output:
        method: fixed
        length: 128
    prefill_variable:
      description: 输入为变长8k~64k，输出为1，侧重测试prefill性能
      request_count: 24
      seed: 827
      input:
        method: gaussian
        mean: 32768
        stddev: 49152
        min: 8192
        max: 65536
      output:
        method: fixed
        length: 1
    prefill_fix:
      description: 输入固定为32768，输出为1，侧重测试prefill性能
      request_count: 24
      seed: 827
      input:
        method: fixed
        length: 32768
      output:
        method: fixed
        length: 1

warmup:
  defaults:
    storage: persistent
    tool_path: /home/w00985415/vllm_test/deps/aisbench_auto_tools_prefix
    output_length: 1
    request_count: 5
    seed: 826
  profiles:
    model_max_len:
      description: 根据模型最大上下文长度派生的公共预热数据
      input_length_from_model_max: true
