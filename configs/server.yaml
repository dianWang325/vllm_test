defaults:
  model: qwen3_30b_a3b_w8a8
  lifecycle:
    health_path: /health
    startup_timeout_seconds: 3600
    health_interval_seconds: 5
    shutdown_timeout_seconds: 120
    request_quiescence:
      metrics_path: /metrics
      request_timeout_seconds: 3
      timeout_seconds: 300
      poll_interval_seconds: 1
      consecutive_idle_samples: 3
  pd:
    proxy:
      lifecycle:
        health_path: /healthcheck
      arguments:
        --workers: 1
        --log-level: INFO
  arguments:
    --host: 127.0.0.1
    --port: 18080
    --trust-remote-code: true
    --tensor-parallel-size: 4
    --pipeline-parallel-size: 2
    --max-num-batched-tokens: 20480
    --block-size: 64
    --enable-chunked-prefill: true
    --enable-request-id-headers: true
    --enforce-eager: true
    --no-enable-prefix-caching: true
    --no-async-scheduling: true
    --enable-expert-parallel: true
  environment:
    ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    VLLM_USE_V2_MODEL_RUNNER: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_LOGGING_LEVEL: INFO
    OMP_PROC_BIND: "false"
    OMP_NUM_THREADS: "10"
    PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
    HCCL_BUFFSIZE: "1024"
    TASK_QUEUE_ENABLE: "1"
    HCCL_OP_EXPANSION_MODE: AIV
    VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "30000"
    HCCL_EXEC_TIMEOUT: "204"
    HCCL_CONNECT_TIMEOUT: "120"
    NO_PROXY: 127.0.0.1,localhost
    no_proxy: 127.0.0.1,localhost
  unset_environment:
    - ASCEND_LAUNCH_BLOCKING

profiles:
  non_pd_baseline:
    description: 非 PD、不启用 CPP 或 SRF 的基线服务
  non_pd_cpp:
    description: 非 PD、启用动态 CPP 的服务
    arguments:
      --additional-config:
        scheduler_config:
          profiling_chunk_config:
            enabled: true
            smooth_factor: 1.0
            need_timing: true
  non_pd_srf:
    description: 非 PD、启用短请求优先调度的服务
    arguments:
      --additional-config:
        scheduler_config:
          short_request_first_config:
            enabled: true
            threshold: 40960
            long_max_wait_ms: 2000
  non_pd_cpp_srf:
    description: 非 PD、同时启用动态 CPP 与 SRF 的服务
    arguments:
      --additional-config:
        scheduler_config:
          profiling_chunk_config:
            enabled: true
            smooth_factor: 1.0
            need_timing: true
          short_request_first_config:
            enabled: true
            threshold: 40960
            long_max_wait_ms: 2000
  pd:
    description: 单机、由框架同时管理 Prefill 和 Decode 的通用 PD 服务
    arguments:
      --host: 127.0.0.1
      --port: 18080
      --gpu-memory-utilization: 0.90
    pd:
      proxy:
        script: /home/w00985415/proj_0825/deps/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
      prefill:
        nodes: {p0: {}}
        arguments:
          --host: 127.0.0.1
          --port: 18081
          --max-num-batched-tokens: 8192
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_producer
            kv_port: "36000"
            engine_id: "0"
      decode:
        nodes: {d0: {}}
        arguments:
          --host: 127.0.0.1
          --port: 18082
          --max-num-batched-tokens: 320
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_consumer
            kv_port: "36100"
            engine_id: "1"
  pd_two_host:
    description: 跨节点、由框架管理 Prefill 并复用 external Decode 的通用 PD 服务
    arguments:
      --host: 127.0.0.1
      --port: 18080
      --gpu-memory-utilization: 0.90
    pd:
      proxy:
        script: /home/w00985415/proj_0825/deps/vllm-ascend/examples/disaggregated_prefill_v1/load_balance_proxy_server_example.py
      prefill:
        nodes: {p0: {}}
        arguments:
          --host: 0.0.0.0
          --port: 18081
          --max-num-batched-tokens: 8192
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_producer
            kv_port: "36000"
            engine_id: "0"
      decode:
        nodes: {d0: {}}
        external: true
        arguments:
          --host: 0.0.0.0
          --port: 18082
          --max-num-batched-tokens: 320
          --kv-transfer-config:
            kv_connector: MooncakeConnectorV1
            kv_role: kv_consumer
            kv_port: "36100"
            engine_id: "1"
