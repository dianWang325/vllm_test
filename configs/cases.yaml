cases:
  baseline_smoke:
    description: 基线服务功能冒烟
    type: performance
    server: baseline
    data: functional_smoke
    bench: functional_smoke
    report: functional
  cpp_smoke:
    description: CPP 服务功能冒烟并执行手动预热
    type: performance
    server: cpp
    data: functional_smoke
    warmup: cpp_long
    bench: functional_smoke
    report: functional
  srf_smoke:
    description: SRF 服务短长混合功能验证
    type: performance
    server: srf
    data: srf_mixed
    bench: srf_mixed
    report: functional
    overrides:
      data:
        request_count: 8
      bench:
        repeats: 1
  cpp_srf_smoke:
    description: CPP+SRF 服务短长混合功能验证并执行手动预热
